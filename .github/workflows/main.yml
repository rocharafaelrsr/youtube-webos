name: Build & Test

on:
  push:
    branches: [main, 'fix/457-playback-rc1']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Serialization regression tests
        run: node tools/test-457.mjs
      - run: pnpm run build
      - run: pnpm run test:compat
      - run: pnpm run package
      - name: Upload installable IPK
        uses: actions/upload-artifact@v4
        with:
          name: youtube_adfree_0.5.4_rc1_ipk
          path: youtube.leanback.v4_*_all.ipk
          if-no-files-found: error
